{{ define "main" }}
<article class="page wide">
  {{ partial "crumbs.html" . }}
  <h1>{{ .Title }}</h1>
  <p class="lede">{{ .Description }}</p>
  <div class="tool-panel" id="dosha-tool">
    {{ partial "birth-form.html" (dict "showTime" true) }}
    <div class="btn-row"><button class="btn" type="button" data-run>Check doshas</button></div>
    <div class="error-msg" data-error hidden></div>
    <div class="result-panel" data-result hidden><div data-result-body></div></div>
  </div>
  {{ .Content }}
  {{ partial "ad-slot.html" (dict "Site" .Site "slot" "8888888888") }}
  <script type="module">
    import { initDoshaTool } from "{{ "js/tools/dosha-tool.js" | relURL }}";
    initDoshaTool();
  </script>
</article>
{{ end }}
