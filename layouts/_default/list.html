{{ define "main" }}
<article class="page wide">
  {{ partial "crumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  {{ .Content }}
  <div class="grid">
    {{ range .Pages }}
    <a class="tile reveal" href="{{ .RelPermalink }}">
      <span class="tile-glyph">✦</span>
      <span class="tile-body"><strong>{{ .Title }}</strong><small>{{ .Params.summary }}</small></span>
    </a>
    {{ end }}
  </div>
  {{ partial "ad-slot.html" (dict "Site" .Site "slot" "2222222222") }}
</article>
{{ end }}
