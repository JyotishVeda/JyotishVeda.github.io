{{/* Usage: {{ partial "birth-form.html" (dict "who" "" "showTime" true) }} */}}

<div class="form-grid"{{ with .who }} data-birth="{{ . }}"{{ end }}>
  <div>
    <label for="date-{{ .who | default "main" }}">Date of birth</label>
    <input type="date" id="date-{{ .who | default "main" }}" data-date>
  </div>

  {{ if .showTime }}
  <div>
    <label for="time-{{ .who | default "main" }}">Time of birth (local)</label>
    <input type="time" id="time-{{ .who | default "main" }}" data-time value="12:00">
  </div>
  {{ end }}

  <div>
    <label for="place-{{ .who | default "main" }}">Place of birth</label>
    <div class="place-search-row">
      <input
        type="text"
        id="place-{{ .who | default "main" }}"
        data-place
        autocomplete="off"
        placeholder="Enter city, town or village"
      >
      <button type="button" class="btn btn-ghost" data-find-place>
        Find place
      </button>
    </div>
  </div>
</div>

<div
  class="saved-birth-banner"
  data-saved-banner
  hidden
>
  <span data-saved-banner-text></span>
  <button type="button" class="btn btn-ghost" data-forget>
    Forget &amp; enter new
  </button>
</div>

<div class="remember-birth">
  <label>
    <input
      type="checkbox"
      data-remember
      checked
    >
    Remember these details on this device
    <small>(saved only in your browser, never sent anywhere)</small>
  </label>
</div>

<div class="place-result" data-place-result hidden>
  <div class="place-result-title" data-place-label></div>
  <div class="place-result-meta">
    <span data-place-coords></span>
    <span data-place-timezone></span>
  </div>
</div>

<input type="hidden" data-lat>
<input type="hidden" data-lon>
<input type="hidden" data-tz>
<input type="hidden" data-timezone>

<div class="error-msg" data-place-error hidden></div>
