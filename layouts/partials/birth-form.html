{{/* Usage: {{ partial "birth-form.html" (dict "who" "" "showTime" true) }} */}}
<div class="form-grid"{{ with .who }} data-birth="{{ . }}"{{ end }}>
  <div>
    <label for="date-{{ .who | default "main" }}">Date of birth</label>
    <input type="date" id="date-{{ .who | default "main" }}" data-date>
  </div>
  {{ if .showTime }}
  <div>
    <label for="time-{{ .who | default "main" }}">Time of birth (local)</label>
    <input type="time" id="time-{{ .who | default "main" }}" data-time value="12:00">
  </div>
  {{ end }}
  <div>
    <label for="place-{{ .who | default "main" }}">Place of birth</label>
    <select id="place-{{ .who | default "main" }}" data-place></select>
  </div>
</div>
<div class="form-grid" data-custom-place hidden style="margin-top:.8rem">
  <div><label>Latitude (N positive)</label><input type="number" step="0.0001" data-lat placeholder="18.5204"></div>
  <div><label>Longitude (E positive)</label><input type="number" step="0.0001" data-lon placeholder="73.8567"></div>
  <div><label>UTC offset (hours)</label><input type="number" step="0.25" data-tz placeholder="5.5"></div>
</div>
