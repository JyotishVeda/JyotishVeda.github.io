surya:
  order: 1
  name: "Surya"
  english: "Sun"
  symbol: "☉"
  karaka: "Atma (soul), father, authority, vitality, bone and eyesight"
  own: "Simha"
  exalted: "Mesha 10°"
  debilitated: "Tula 10°"
  moolatrikona: "Simha 0°–20°"
  friends: "Chandra, Mangal, Guru"
  enemies: "Shukra, Shani"
  neutral: "Budha"
  dasha_years: 6
  day: "Sunday"
  gem: "Ruby (Manik)"
  metal: "Gold, copper"
  deity: "Surya Narayana"
  mantra: "Om Hram Hreem Hraum Sah Suryaya Namah"
  direction: "East"
  aspects: "7th house only"
  nature: "Malefic (krura), hot and dry"
  nakshatras: "Krittika, Uttara Phalguni, Uttara Ashadha"
  summary: "Atmakaraka — soul, authority, father and the visible self."

chandra:
  order: 2
  name: "Chandra"
  english: "Moon"
  symbol: "☽"
  karaka: "Manas (mind), mother, emotion, fluids, public and memory"
  own: "Karka"
  exalted: "Vrishabha 3°"
  debilitated: "Vrishchika 3°"
  moolatrikona: "Vrishabha 4°–30°"
  friends: "Surya, Budha"
  enemies: "None"
  neutral: "Mangal, Guru, Shukra, Shani"
  dasha_years: 10
  day: "Monday"
  gem: "Pearl (Moti)"
  metal: "Silver"
  deity: "Parvati / Soma"
  mantra: "Om Shram Shreem Shraum Sah Chandraya Namah"
  direction: "North-west"
  aspects: "7th house only"
  nature: "Benefic when waxing, weak when waning"
  nakshatras: "Rohini, Hasta, Shravana"
  summary: "Manakaraka — the mind, the mother and the Vedic 'moon sign'."

mangal:
  order: 3
  name: "Mangal"
  english: "Mars"
  symbol: "♂"
  karaka: "Courage, siblings, land, energy, surgery, blood and conflict"
  own: "Mesha, Vrishchika"
  exalted: "Makara 28°"
  debilitated: "Karka 28°"
  moolatrikona: "Mesha 0°–12°"
  friends: "Surya, Chandra, Guru"
  enemies: "Budha"
  neutral: "Shukra, Shani"
  dasha_years: 7
  day: "Tuesday"
  gem: "Red coral (Moonga)"
  metal: "Copper"
  deity: "Kartikeya / Bhumi"
  mantra: "Om Kram Kreem Kraum Sah Bhaumaya Namah"
  direction: "South"
  aspects: "4th, 7th and 8th houses"
  nature: "Malefic, hot and dry"
  nakshatras: "Mrigashira, Chitra, Dhanishta"
  summary: "Bhumikaraka — courage, land, brothers and the cutting edge."

budha:
  order: 4
  name: "Budha"
  english: "Mercury"
  symbol: "☿"
  karaka: "Intellect, speech, trade, calculation, skin and nervous system"
  own: "Mithuna, Kanya"
  exalted: "Kanya 15°"
  debilitated: "Meena 15°"
  moolatrikona: "Kanya 16°–20°"
  friends: "Surya, Shukra"
  enemies: "Chandra"
  neutral: "Mangal, Guru, Shani"
  dasha_years: 17
  day: "Wednesday"
  gem: "Emerald (Panna)"
  metal: "Brass, bronze"
  deity: "Vishnu"
  mantra: "Om Bram Breem Braum Sah Budhaya Namah"
  direction: "North"
  aspects: "7th house only"
  nature: "Neutral — takes on the character of its companions"
  nakshatras: "Ashlesha, Jyeshtha, Revati"
  summary: "Buddhikaraka — intelligence, speech, commerce and analysis."

guru:
  order: 5
  name: "Guru"
  english: "Jupiter"
  symbol: "♃"
  karaka: "Wisdom, teachers, children, wealth, dharma, liver and fat"
  own: "Dhanu, Meena"
  exalted: "Karka 5°"
  debilitated: "Makara 5°"
  moolatrikona: "Dhanu 0°–10°"
  friends: "Surya, Chandra, Mangal"
  enemies: "Budha, Shukra"
  neutral: "Shani"
  dasha_years: 16
  day: "Thursday"
  gem: "Yellow sapphire (Pukhraj)"
  metal: "Gold"
  deity: "Brihaspati / Dakshinamurti"
  mantra: "Om Gram Greem Graum Sah Gurave Namah"
  direction: "North-east"
  aspects: "5th, 7th and 9th houses"
  nature: "Great benefic, expansive"
  nakshatras: "Punarvasu, Vishakha, Purva Bhadrapada"
  summary: "Gnyanakaraka — the great benefic: teachers, dharma and expansion."

shukra:
  order: 6
  name: "Shukra"
  english: "Venus"
  symbol: "♀"
  karaka: "Spouse, pleasure, art, vehicles, comfort, reproductive fluids"
  own: "Vrishabha, Tula"
  exalted: "Meena 27°"
  debilitated: "Kanya 27°"
  moolatrikona: "Tula 0°–15°"
  friends: "Budha, Shani"
  enemies: "Surya, Chandra"
  neutral: "Mangal, Guru"
  dasha_years: 20
  day: "Friday"
  gem: "Diamond (Heera)"
  metal: "Silver, platinum"
  deity: "Shukracharya / Lakshmi"
  mantra: "Om Dram Dreem Draum Sah Shukraya Namah"
  direction: "South-east"
  aspects: "7th house only"
  nature: "Benefic, cool and moist"
  nakshatras: "Bharani, Purva Phalguni, Purva Ashadha"
  summary: "Kalatrakaraka — marriage, beauty, art and material enjoyment."

shani:
  order: 7
  name: "Shani"
  english: "Saturn"
  symbol: "♄"
  karaka: "Longevity, discipline, labour, sorrow, servants, bones and nerves"
  own: "Makara, Kumbha"
  exalted: "Tula 20°"
  debilitated: "Mesha 20°"
  moolatrikona: "Kumbha 0°–20°"
  friends: "Budha, Shukra"
  enemies: "Surya, Chandra, Mangal"
  neutral: "Guru"
  dasha_years: 19
  day: "Saturday"
  gem: "Blue sapphire (Neelam)"
  metal: "Iron, steel"
  deity: "Shani Dev / Hanuman"
  mantra: "Om Pram Preem Praum Sah Shanaischaraya Namah"
  direction: "West"
  aspects: "3rd, 7th and 10th houses"
  nature: "Malefic, cold and dry; the great teacher through delay"
  nakshatras: "Pushya, Anuradha, Uttara Bhadrapada"
  summary: "Ayushkaraka — time, delay, labour and the discipline of limits."

rahu:
  order: 8
  name: "Rahu"
  english: "North Lunar Node"
  symbol: "☊"
  karaka: "Obsession, foreign things, technology, ambition, illusion"
  own: "No sign rulership (acts through its dispositor)"
  exalted: "Commonly Vrishabha or Mithuna, by school"
  debilitated: "Commonly Vrishchika or Dhanu, by school"
  moolatrikona: "Not assigned"
  friends: "Shukra, Shani, Budha"
  enemies: "Surya, Chandra, Mangal"
  neutral: "Guru"
  dasha_years: 18
  day: "Saturday (with Shani)"
  gem: "Hessonite (Gomed)"
  metal: "Lead"
  deity: "Durga"
  mantra: "Om Bhram Bhreem Bhraum Sah Rahave Namah"
  direction: "South-west"
  aspects: "5th, 7th and 9th houses (school-dependent)"
  nature: "Shadowy malefic, amplifies whatever it touches"
  nakshatras: "Ardra, Swati, Shatabhisha"
  summary: "The north node — amplification, craving and the foreign."

ketu:
  order: 9
  name: "Ketu"
  english: "South Lunar Node"
  symbol: "☋"
  karaka: "Detachment, moksha, past skill, sudden loss, occult insight"
  own: "No sign rulership (acts through its dispositor)"
  exalted: "Commonly Vrishchika or Dhanu, by school"
  debilitated: "Commonly Vrishabha or Mithuna, by school"
  moolatrikona: "Not assigned"
  friends: "Mangal, Shukra, Shani"
  enemies: "Surya, Chandra"
  neutral: "Budha, Guru"
  dasha_years: 7
  day: "Tuesday (with Mangal)"
  gem: "Cat's eye (Lehsunia)"
  metal: "Mixed alloys"
  deity: "Ganesha"
  mantra: "Om Sram Sreem Sraum Sah Ketave Namah"
  direction: "North-west"
  aspects: "5th, 7th and 9th houses (school-dependent)"
  nature: "Shadowy malefic, subtracts and detaches"
  nakshatras: "Ashwini, Magha, Mula"
  summary: "The south node — detachment, inherited skill and release."
